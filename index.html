<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>ChessRemedy</title>
    <script>
      // Pre-mount theme application — prevents FOUC.
      // The Dexie `settings` table is the source of truth for theme.
      // This localStorage key is a FOUC hint ONLY; it is overwritten
      // by useTheme on first React mount. See .opencode/plans/001-foundation.md §7.5.
      (function () {
        try {
          var key = 'chessremedy:theme-hint';
          var stored = window.localStorage.getItem(key);
          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          } else {
            theme = 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
